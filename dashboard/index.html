<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zero-Trust Policy Synthesis Engine</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  /* ── Reset & base ────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:        #F6F8FC;
    --sidebar:   #FFFFFF;
    --primary:   #2563EB;
    --primary-light: #EFF6FF;
    --success:   #10B981;
    --warning:   #F59E0B;
    --danger:    #EF4444;
    --purple:    #8B5CF6;
    --card:      #FFFFFF;
    --text:      #0F172A;
    --muted:     #64748B;
    --border:    #E2E8F0;
    --radius:    16px;
    --shadow:    0 1px 3px rgba(15, 23, 42, 0.04), 0 1px 2px rgba(15, 23, 42, 0.02);
  }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
    font-size: 14px;
  }

  /* ── Sidebar ─────────────────────────────────────────────────────── */
  .sidebar {
    width: 68px;
    min-height: 100vh;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 0;
    gap: 8px;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 100;
  }
  .sidebar-logo {
    width: 40px; height: 40px;
    background: transparent;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
  }
  .sidebar-logo svg { color: var(--primary); }
  .nav-item {
    width: 48px; height: 44px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all .15s ease;
    color: #94A3B8;
    position: relative;
  }
  .nav-item:hover { background: #F1F5F9; color: #334155; }
  .nav-item.active {
    background: var(--primary-light);
    color: var(--primary);
    border-left: 3px solid var(--primary);
    border-top-left-radius: 2px;
    border-bottom-left-radius: 2px;
  }
  .nav-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none;
                  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .nav-spacer { flex: 1; }

  /* ── Main layout ─────────────────────────────────────────────────── */
  .main {
    margin-left: 68px;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ── Header ──────────────────────────────────────────────────────── */
  .header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 50;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header-title-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #F1F5F9;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
  }
  .header-title-pill span { color: #94A3B8; font-weight: 400; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .header-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #E2E8F0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: #475569;
    position: relative;
  }
  .header-avatar::after {
    content: '';
    position: absolute;
    bottom: -1px; right: -1px;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #10B981;
    border: 2px solid #FFFFFF;
  }
  .header-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-title span { font-size: 12px; font-weight: 400; color: var(--muted); }
  .status-badge {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px; font-weight: 600;
    background: #ECFDF5; color: #15803D;
  }
  .status-badge.offline { background: #FEF2F2; color: #DC2626; }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: currentColor;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; } 50% { opacity: .4; }
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .refresh-info { font-size: 11px; color: var(--muted); }

  /* ── Page content ────────────────────────────────────────────────── */
  .content { padding: 24px 28px; flex: 1; }

  /* ── Stat cards ──────────────────────────────────────────────────── */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }
  @media (max-width: 1100px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
  .stat-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: transform .15s;
  }
  .stat-card:hover { transform: translateY(-2px); }
  .stat-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .stat-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none;
                   stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .stat-icon.blue   { background: #EFF6FF; color: var(--primary); }
  .stat-icon.green  { background: #F0FDF4; color: var(--success); }
  .stat-icon.orange { background: #FFFBEB; color: var(--warning); }
  .stat-icon.purple { background: #F5F3FF; color: var(--purple); }
  .stat-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
  .stat-value { font-size: 28px; font-weight: 700; line-height: 1; color: var(--text); }

  /* ── Charts row ──────────────────────────────────────────────────── */
  .charts-row {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }
  @media (max-width: 900px) { .charts-row { grid-template-columns: 1fr; } }

  /* ── Card ────────────────────────────────────────────────────────── */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
  }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .card-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .card-badge {
    font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 20px;
    background: #EFF6FF; color: var(--primary);
  }

  /* ── Area chart ──────────────────────────────────────────────────── */
  #traffic-chart { width: 100%; height: 220px; }
  .chart-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 60px 0; }

  /* ── Donut chart ─────────────────────────────────────────────────── */
  #donut-chart { width: 100%; height: 220px; }
  .donut-legend { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* ── Bottom row ──────────────────────────────────────────────────── */
  .bottom-row {
    display: grid;
    grid-template-columns: 3fr 2fr;
    gap: 16px;
  }
  @media (max-width: 900px) { .bottom-row { grid-template-columns: 1fr; } }

  /* ── Findings table ──────────────────────────────────────────────── */
  .findings-table { width: 100%; border-collapse: collapse; }
  .findings-table th {
    text-align: left; font-size: 11px; font-weight: 600;
    color: var(--muted); text-transform: uppercase; letter-spacing: .05em;
    padding: 8px 12px; border-bottom: 1px solid var(--border);
  }
  .findings-table td { padding: 10px 12px; font-size: 13px; }
  .findings-table tbody tr { border-bottom: 1px solid #F3F4F6; }
  .findings-table tbody tr:nth-child(even) { background: #FAFBFD; }
  .findings-table tbody tr { border-left: 3px solid transparent; }
  .findings-table tbody tr.sev-high   { border-left-color: var(--danger); }
  .findings-table tbody tr.sev-medium { border-left-color: var(--warning); }
  .findings-table tbody tr.sev-low    { border-left-color: var(--primary); }
  .severity-badge {
    display: inline-block;
    font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 20px;
  }
  .severity-badge.high   { background: #FEF2F2; color: var(--danger); }
  .severity-badge.medium { background: #FFFBEB; color: var(--warning); }
  .severity-badge.low    { background: #EFF6FF; color: var(--primary); }
  .type-tag {
    font-size: 11px; color: var(--muted); background: #F3F4F6;
    padding: 1px 6px; border-radius: 4px;
  }
  .table-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 32px; }

  /* ── Activity log ────────────────────────────────────────────────── */
  .activity-log { display: flex; flex-direction: column; gap: 10px; max-height: 320px; overflow-y: auto; }
  .activity-item {
    display: flex; gap: 10px; align-items: flex-start;
    font-size: 12px; line-height: 1.5;
  }
  .activity-time { color: var(--muted); white-space: nowrap; flex-shrink: 0; }
  .activity-dot {
    width: 8px; height: 8px; border-radius: 50%;
    margin-top: 4px; flex-shrink: 0;
  }
  .activity-dot.info   { background: var(--primary); }
  .activity-dot.ok     { background: var(--success); }
  .activity-dot.warn   { background: var(--warning); }
  .activity-dot.danger { background: var(--danger); }
  .activity-text { color: var(--text); }
  .activity-empty { color: var(--muted); font-size: 13px; padding: 24px; text-align: center; }

  /* ── Tooltip ─────────────────────────────────────────────────────── */
  .d3-tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--sidebar);
    color: #fff;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity .15s;
    z-index: 200;
  }

  /* ── Scrollbar ───────────────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
</style>
</head>

<script>
/* ── Helpers ───────────────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const fmt = d3.timeFormat('%H:%M');
const fmtFull = d3.timeFormat('%b %d %H:%M');

function setStat(id, val) { $(id).textContent = val === null ? '—' : val; }

function setStatus(online) {
  const badge = $('status-badge');
  const txt   = $('status-text');
  if (online) {
    badge.className = 'status-badge';
    txt.textContent = 'Live';
  } else {
    badge.className = 'status-badge offline';
    txt.textContent = 'Offline';
  }
}

/* ── Fetch wrappers ────────────────────────────────────────────────────── */
async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

/* ── Area chart (Traffic Volume) ───────────────────────────────────────── */
function drawAreaChart(history) {
  const svgEl = $('traffic-chart');
  d3.select(svgEl).selectAll('*').remove();

  if (!history || history.length === 0) {
    d3.select(svgEl).append('text')
      .attr('x', '50%').attr('y', '50%')
      .attr('text-anchor', 'middle').attr('dominant-baseline', 'middle')
      .attr('fill', '#9CA3AF').attr('font-size', 13)
      .text('No traffic data yet — is the collector running?');
    return;
  }

  const W = svgEl.getBoundingClientRect().width || 600;
  const H = 220;
  const margin = { top: 10, right: 20, bottom: 30, left: 46 };
  const iW = W - margin.left - margin.right;
  const iH = H - margin.top - margin.bottom;

  const data = history.map(d => ({
    t: new Date(d.window_end),
    v: +d.total_requests
  })).filter(d => !isNaN(d.t));

  const xScale = d3.scaleTime()
    .domain(d3.extent(data, d => d.t))
    .range([0, iW]);

  const yScale = d3.scaleLinear()
    .domain([0, d3.max(data, d => d.v) * 1.15 || 10])
    .range([iH, 0]);

  const svg = d3.select(svgEl)
    .attr('width', W).attr('height', H)
    .append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  /* gradient */
  const defs = svg.append('defs');
  const grad = defs.append('linearGradient')
    .attr('id', 'area-grad').attr('x1', 0).attr('y1', 0).attr('x2', 0).attr('y2', 1);
  grad.append('stop').attr('offset', '0%').attr('stop-color', '#3B6FE8').attr('stop-opacity', 0.35);
  grad.append('stop').attr('offset', '100%').attr('stop-color', '#3B6FE8').attr('stop-opacity', 0.02);

  /* grid lines */
  svg.append('g').attr('class', 'grid')
    .call(d3.axisLeft(yScale).ticks(4).tickSize(-iW).tickFormat(''))
    .selectAll('line').attr('stroke', '#E5E8F0').attr('stroke-dasharray', '3,3');
  svg.select('.grid .domain').remove();

  /* area */
  const area = d3.area()
    .x(d => xScale(d.t))
    .y0(iH).y1(d => yScale(d.v))
    .curve(d3.curveMonotoneX);

  svg.append('path').datum(data)
    .attr('fill', 'url(#area-grad)').attr('d', area);

  /* line */
  const line = d3.line()
    .x(d => xScale(d.t)).y(d => yScale(d.v))
    .curve(d3.curveMonotoneX);

  svg.append('path').datum(data)
    .attr('fill', 'none')
    .attr('stroke', '#3B6FE8').attr('stroke-width', 2.5)
    .attr('d', line);

  /* axes */
  svg.append('g').attr('transform', `translate(0,${iH})`)
    .call(d3.axisBottom(xScale).ticks(5).tickFormat(fmt))
    .selectAll('text').attr('fill', '#9CA3AF').attr('font-size', 11);
  svg.select('.domain').attr('stroke', '#E5E8F0');

  svg.append('g')
    .call(d3.axisLeft(yScale).ticks(4))
    .selectAll('text').attr('fill', '#9CA3AF').attr('font-size', 11);
  svg.selectAll('.domain').attr('stroke', '#E5E8F0');
  svg.selectAll('.tick line').attr('stroke', '#E5E8F0');

  /* tooltip overlay */
  const tooltip = $('tooltip');
  const bisect  = d3.bisector(d => d.t).left;
  const overlay  = svg.append('rect')
    .attr('width', iW).attr('height', iH).attr('fill', 'none').attr('pointer-events', 'all');

  const dot = svg.append('circle').attr('r', 5)
    .attr('fill', '#3B6FE8').attr('stroke', '#fff').attr('stroke-width', 2)
    .style('opacity', 0);

  overlay.on('mousemove', function(event) {
    const [mx] = d3.pointer(event);
    const x0   = xScale.invert(mx);
    const i    = bisect(data, x0, 1);
    const d    = i < data.length ? data[i] : data[data.length - 1];
    dot.style('opacity', 1).attr('cx', xScale(d.t)).attr('cy', yScale(d.v));
    tooltip.style.opacity = '1';
    tooltip.style.left    = (event.pageX + 12) + 'px';
    tooltip.style.top     = (event.pageY - 28) + 'px';
    tooltip.textContent   = `${fmtFull(d.t)} · ${d.v} req`;
  }).on('mouseleave', () => {
    dot.style('opacity', 0);
    tooltip.style.opacity = '0';
  });
}

/* ── Donut chart (Policy Status) ───────────────────────────────────────── */
function drawDonut(inferred, enforced) {
  const svgEl   = $('donut-chart');
  const legendEl = $('donut-legend');
  d3.select(svgEl).selectAll('*').remove();
  legendEl.innerHTML = '';

  /* Compute segments from inferred vs enforced */
  let compliant = 0, over = 0, under = 0;

  /* Build maps: service -> rules (methods) from each source */
  const infMap = {};
  (inferred || []).forEach(p => {
    const key = p.service || p.namespace || '?';
    infMap[key] = (p.rules || []).map(r => JSON.stringify(r)).sort();
  });
  const enfMap = {};
  (enforced || []).forEach(p => {
    const key = p.service || p.namespace || '?';
    enfMap[key] = (p.rules || []).map(r => JSON.stringify(r)).sort();
  });

  const allKeys = new Set([...Object.keys(infMap), ...Object.keys(enfMap)]);
  if (allKeys.size === 0) {
    /* Use dummy data to show chart shape */
    compliant = 3; over = 1; under = 1;
  } else {
    allKeys.forEach(k => {
      const inf = JSON.stringify(infMap[k] || []);
      const enf = JSON.stringify(enfMap[k] || []);
      if (inf === enf) compliant++;
      else {
        /* simplified: check if enforced has extras (over) or missing (under) */
        const infSet = new Set(infMap[k] || []);
        const enfSet = new Set(enfMap[k] || []);
        let hasOver  = [...enfSet].some(r => !infSet.has(r));
        let hasUnder = [...infSet].some(r => !enfSet.has(r));
        if (hasOver)  over++;
        if (hasUnder) under++;
        if (!hasOver && !hasUnder) compliant++;
      }
    });
  }

  const segments = [
    { label: 'Compliant',       value: compliant, color: '#22C55E' },
    { label: 'Over-permissive', value: over,       color: '#F59E0B' },
    { label: 'Under-permissive',value: under,      color: '#EF4444' },
  ].filter(s => s.value > 0);

  if (segments.length === 0) {
    segments.push({ label: 'No data', value: 1, color: '#E5E8F0' });
  }

  const W   = svgEl.getBoundingClientRect().width || 260;
  const H   = 220;
  const r   = Math.min(W, H) / 2 - 20;
  const ir  = r * 0.58;

  const svg = d3.select(svgEl)
    .attr('width', W).attr('height', H)
    .append('g').attr('transform', `translate(${W/2},${H/2})`);

  const pie  = d3.pie().value(d => d.value).sort(null);
  const arc  = d3.arc().innerRadius(ir).outerRadius(r).cornerRadius(3).padAngle(0.03);
  const arcH = d3.arc().innerRadius(ir).outerRadius(r + 6).cornerRadius(3).padAngle(0.03);

  const tooltip = $('tooltip');

  svg.selectAll('path').data(pie(segments)).join('path')
    .attr('d', arc)
    .attr('fill', d => d.data.color)
    .on('mouseover', function(event, d) {
      d3.select(this).attr('d', arcH);
      tooltip.style.opacity = '1';
      tooltip.textContent   = `${d.data.label}: ${d.data.value}`;
    })
    .on('mousemove', function(event) {
      tooltip.style.left = (event.pageX + 12) + 'px';
      tooltip.style.top  = (event.pageY - 28) + 'px';
    })
    .on('mouseleave', function(_, d) {
      d3.select(this).attr('d', arc);
      tooltip.style.opacity = '0';
    });

  /* center label */
  const total = segments.reduce((s, d) => s + d.value, 0);
  svg.append('text').attr('text-anchor', 'middle').attr('dy', '-0.2em')
    .attr('font-size', 22).attr('font-weight', 700).attr('fill', '#1A2340')
    .text(total);
  svg.append('text').attr('text-anchor', 'middle').attr('dy', '1.2em')
    .attr('font-size', 11).attr('fill', '#6B7280').text('total rules');

  /* legend */
  segments.forEach(s => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${s.color}"></span>
                      <span>${s.label}</span>
                      <span style="margin-left:auto;font-weight:600">${s.value}</span>`;
    legendEl.appendChild(item);
  });
}

/* ── Findings table ─────────────────────────────────────────────────────── */
function renderFindings(findings) {
  const container = $('findings-container');
  $('findings-badge').textContent = `${findings.length} item${findings.length !== 1 ? 's' : ''}`;

  if (!findings.length) {
    container.innerHTML = '<div class="table-empty">No drift findings — all clear ✓</div>';
    return;
  }

  const rows = findings.map(f => {
    const sev   = (f.severity || 'low').toLowerCase();
    const type  = f.type || '';
    const action = (f.suggested_action || f.action || '').replace(/_/g, ' ');
    const methods = Array.isArray(f.methods) ? f.methods.join(', ') : (f.methods || '');
    return `<tr class="sev-${sev}">
      <td><span class="severity-badge ${sev}">${sev.toUpperCase()}</span></td>
      <td style="font-weight:500">${escHtml(f.service || '')}</td>
      <td><span class="type-tag">${escHtml(type)}</span></td>
      <td style="color:#6B7280">${escHtml(action)}${methods ? ' <span style="font-size:11px;color:#9CA3AF">(' + escHtml(methods) + ')</span>' : ''}</td>
    </tr>`;
  }).join('');

  container.innerHTML = `
    <table class="findings-table">
      <thead><tr>
        <th>Severity</th><th>Service</th><th>Type</th><th>Action / Methods</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── Activity log ─────────────────────────────────────────────────────── */
const activityItems = [];

function pushActivity(text, kind = 'info') {
  const now = new Date();
  activityItems.unshift({ text, kind, time: fmtFull(now) });
  if (activityItems.length > 40) activityItems.length = 40;
}

function renderActivity() {
  const log = $('activity-log');
  if (!activityItems.length) {
    log.innerHTML = '<div class="activity-empty">No recent activity</div>';
    return;
  }
  log.innerHTML = activityItems.slice(0, 20).map(a =>
    `<div class="activity-item">
      <span class="activity-time">${a.time}</span>
      <span class="activity-dot ${a.kind}"></span>
      <span class="activity-text">${escHtml(a.text)}</span>
     </div>`
  ).join('');
}

/* ── Main data refresh ──────────────────────────────────────────────────── */
let firstLoad = true;

async function refresh() {
  let anyOk = false;

  /* ── Graph (services count) ── */
  try {
    const g = await fetchJSON('/api/graph');
    if (g.ok && g.edges) {
      const services = new Set();
      g.edges.forEach(e => { services.add(e.source_workload); services.add(e.destination_workload); });
      setStat('stat-services', services.size);
      if (firstLoad) pushActivity(`Traffic graph loaded — ${g.edges.length} edges`, 'ok');
    } else {
      setStat('stat-services', 0);
    }
    anyOk = true;
  } catch(e) {
    setStat('stat-services', '?');
    if (firstLoad) pushActivity('Traffic graph unavailable', 'warn');
  }

  /* ── History (area chart) ── */
  try {
    const h = await fetchJSON('/api/history');
    drawAreaChart(h.history || []);
    if (firstLoad && h.history && h.history.length) {
      pushActivity(`Traffic history loaded — ${h.history.length} windows`, 'info');
    }
    anyOk = true;
  } catch(e) {
    drawAreaChart([]);
  }

  /* ── Policies ── */
  let enforcedPolicies = [];
  try {
    const p = await fetchJSON('/api/policies');
    enforcedPolicies = p.policies || [];
    setStat('stat-policies', enforcedPolicies.length);
    if (firstLoad) pushActivity(`Enforced policies loaded — ${enforcedPolicies.length} entries`, 'ok');
    anyOk = true;
  } catch(e) {
    setStat('stat-policies', 0);
  }

  /* ── Inferred ── */
  let inferredPolicies = [];
  try {
    const i = await fetchJSON('/api/inferred');
    inferredPolicies = i.policies || [];
    if (firstLoad) pushActivity(`Inferred policies loaded — ${inferredPolicies.length} entries`, 'info');
    anyOk = true;
  } catch(e) { /* silent */ }

  /* ── Draw donut ── */
  drawDonut(inferredPolicies, enforcedPolicies);

  /* ── Findings ── */
  try {
    const f = await fetchJSON('/api/findings');
    const findings = f.findings || [];
    setStat('stat-findings', findings.length);
    setStat('stat-prs', findings.length > 0 ? 1 : 0);
    renderFindings(findings);
    if (firstLoad) {
      if (findings.length) {
        pushActivity(`${findings.length} drift finding${findings.length > 1 ? 's' : ''} detected`, 'warn');
        pushActivity('PR opened for policy sync', 'danger');
      } else {
        pushActivity('No drift findings — policies in sync', 'ok');
      }
    }
    anyOk = true;
  } catch(e) {
    setStat('stat-findings', 0);
    setStat('stat-prs', 0);
    renderFindings([]);
  }

  setStatus(anyOk);
  $('last-updated').textContent = `Updated ${fmtFull(new Date())}`;

  if (firstLoad) {
    pushActivity('Dashboard connected', 'info');
    firstLoad = false;
  }
  renderActivity();
}

/* ── Boot ──────────────────────────────────────────────────────────────── */
refresh();
setInterval(refresh, 5000);

/* Re-draw charts on window resize */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(refresh, 200);
});
</script>
