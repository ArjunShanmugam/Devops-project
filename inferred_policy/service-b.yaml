apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: service-b-policy
  namespace: default
spec:
  selector:
    matchLabels:
      app: service-b
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/default/sa/service-a-sa
    to:
    - operation:
        methods:
        - GET
